plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.lynx'
version = '0.1.0'

android {
  namespace "expo.modules.lynx"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Lynx runtime + the XElement Behaviors required for <input> / <textarea> and
  // other extended elements (without these: RuntimeException: "No BehaviorController
  // defined for class input"). Mirrors lynx-expo-demo/packages/lynx-view.
  implementation "org.lynxsdk.lynx:lynx:4.0.0"
  implementation "org.lynxsdk.lynx:lynx-jssdk:4.0.0"
  implementation "org.lynxsdk.lynx:lynx-trace:4.0.0"
  implementation "org.lynxsdk.lynx:primjs:4.0.0"
  implementation "org.lynxsdk.lynx:xelement:4.0.0"
  implementation "org.lynxsdk.lynx:xelement-input:4.0.0"

  // Log and HTTP services used by LynxEnv.init.
  implementation "org.lynxsdk.lynx:lynx-service-log:4.0.0"
  implementation "org.lynxsdk.lynx:lynx-service-http:4.0.0"
  implementation "com.squareup.okhttp3:okhttp:4.9.0"

  // Managed delivery reads one tiny synchronous launch-state blob before the
  // first Lynx render. Keep ARMv7 support until the host drops that ABI.
  implementation "com.tencent:mmkv:1.3.17"

  // No Lynx image service: Fresco conflicts with host dependencies. Add a
  // compatible ILynxImageService only when image support is deliberately scoped.

  // <x-lynx-fast-image> renders through Glide (android/src/main/java/expo/
  // modules/lynx/fastimage/). Same version Expo Image 57.x uses, so the host
  // resolves one Glide and one memory/disk cache. We add NO @GlideModule:
  // when expo-image is present its AppGlideModule + OkHttp integration cover
  // us; the plain Glide.with() API is used so no generated GlideApp is needed.
  implementation "com.github.bumptech.glide:glide:5.0.5"

  // B2 (#16): the forced-reload watchdog / batch-settlement logic in
  // `ManagedReloadBatch` is deliberately Android-free so it runs as a plain
  // JVM unit test (`./gradlew :expo-lynx:testDebugUnitTest`) — no Robolectric,
  // no MMKV native lib, no instrumented device.
  testImplementation "junit:junit:4.13.2"
}
