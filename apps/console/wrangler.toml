name = "lynx-delivery"
main = "worker/index.ts"
compatibility_date = "2026-08-28"
workers_dev = true

[assets]
directory = "dist"
not_found_handling = "single-page-application"
run_worker_first = [ "/__local-r2", "/__local-r2/*", "/api", "/api/*", "/health", "/v1", "/v1/*" ]

[[r2_buckets]]
bucket_name = "lynx-artifacts"
binding = "ARTIFACTS"

[[d1_databases]]
binding = "DB"
database_name = "lynx-delivery"
database_id = "00c8145c-34e5-43f9-b732-7326ce9c52f6"
migrations_dir = "migrations"
